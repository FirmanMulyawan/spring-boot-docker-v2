version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: belajar_db
    ports:
      # Port kiri (5433) bisa diakses dari laptopmu, port kanan (5432) di dalam docker
      - "5433:5432"
    volumes:
      # Menyimpan data tabel ke volume agar tidak hilang saat container mati
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    # Health check: Docker akan cek apakah PostgreSQL sudah benar-benar siap menerima koneksi
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d belajar_db" ]
      interval: 5s # cek setiap 5 detik
      timeout: 5s # timeout tiap pengecekan
      retries: 5 # coba maksimal 5 kali sebelum dianggap gagal

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6380:6379"
    networks:
      - app_network
    # healthcheck:
    #   test: ["CMD-SHELL", "redis-cli ping"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  app:
    # Build image langsung dari Dockerfile yang ada di folder ini (titik .)
    build: .
    # container_name: spring_app (dihapus agar bisa di-scale menjadi multiple instance)
    # ports: (port 8081 tidak perlu di-bind ke host laptop agar tidak bentrok saat di-scale)
    environment:
      # Mengirim environment variable ke aplikasi Spring Boot
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=belajar_db
      - DB_USER=postgres
      - DB_PASS=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      postgres:
        # Spring Boot HANYA akan start setelah postgres dinyatakan "healthy"
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  # Deklarasi nama volume yang digunakan di container postgres
  postgres_data:
