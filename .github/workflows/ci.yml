name: CI/CD Pipeline

# Pipeline ini jalan saat ada push atau pull_request ke branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # =============================================
  # JOB 1: Jalankan semua unit test
  # =============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Ambil kode dari GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Langkah 2: Setup Java 21 (sesuai pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Langkah 3: Cache dependency Maven agar pipeline lebih cepat
      # Tanpa cache, Maven download ulang semua dependency tiap pipeline jalan
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Langkah 4: Jalankan semua test (pakai H2 in-memory, tidak perlu PostgreSQL)
      - name: Run tests
        working-directory: ./belajar-spring-docker-v2
        run: ./mvnw test

  # =============================================
  # JOB 2: Build JAR, lalu build & push Docker Image
  # Hanya jalan jika:
  #   - Job "test" LULUS
  #   - Event adalah "push" ke branch main (bukan pull_request)
  # =============================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # Tunggu job test selesai dan lulus dulu

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Langkah 1: Ambil kode dari GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Langkah 2: Setup Java 21 untuk build JAR
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Langkah 3: Cache Maven (sama seperti job test)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Langkah 4: Build JAR (skip test karena sudah lulus di job sebelumnya)
      # Dockerfile butuh file JAR di folder target/ untuk di-COPY
      - name: Build JAR
        working-directory: ./belajar-spring-docker-v2
        run: ./mvnw package -DskipTests

      # Langkah 5: Login ke Docker Hub pakai Secrets (aman, tidak hardcode password)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Langkah 6: Build Docker image dari Dockerfile dan push ke Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./belajar-spring-docker-v2  # Lokasi Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/belajar-spring-docker:latest
